version: "3.9"

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studentdb
    # You don't need to expose 3306 to the host unless you want external tools to connect.
    # Comment these lines to avoid port conflicts:
